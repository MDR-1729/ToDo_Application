<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit task - ToDo Application</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <style>

        body { min-height: 100vh; background: #f4f6fb; }
        .edit-card { max-width: 640px; border: 1px solid #e2e8f0; border-radius: 1.1rem; }
        .form-control { min-height: 3.25rem; border-radius: .75rem; }
        @media (max-width: 575.98px) { .edit-actions > * { width: 100%; } }

    </style>

</head>
<body>

    <main class="container py-4 py-md-5">
        <section class="card edit-card shadow-sm mx-auto">
            <div class="card-body p-4 p-md-5">
                <a class="text-decoration-none text-secondary small d-inline-block mb-4" href="{% url 'home' %}">
                    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back to tasks
                </a>
                <h1 class="h3 fw-bold mb-2">Edit task</h1>
                <p class="text-secondary mb-4">Make a change to your task and save it below.</p>
                <form method="post">
                    {% csrf_token %}
                    <label class="form-label fw-semibold" for="{{ form.task.id_for_label }}">Task name</label>
                    {{ form.task }}
                    {% for error in form.task.errors %}
                        <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                    <div class="edit-actions d-flex flex-column flex-sm-row gap-2 mt-4">
                        <button class="btn btn-primary px-4" type="submit">Save changes</button>
                        <a class="btn btn-outline-secondary px-4" href="{% url 'home' %}">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
